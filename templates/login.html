{% extends "base.html" %}
{% block title %}Login | Women's Safety System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card card-safety p-3 p-md-4">
      <div class="card-body">
        <div class="text-center mb-4">
          <div class="stat-icon bg-primary-subtle text-primary mx-auto mb-2">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h3 class="fw-bold">User Login</h3>
          <p class="text-muted small mb-0">Access your safety dashboard and emergency tools.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required placeholder="name@example.com" />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password" />
          </div>

          <button type="submit" class="btn btn-brand w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </button>
        </form>

        <hr class="my-4" />
        <div class="text-center small text-muted">
          New user? <a href="{{ url_for('auth.register') }}" class="fw-semibold">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
