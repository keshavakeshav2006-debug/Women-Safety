{% extends "base.html" %}
{% block title %}Administrator Login | Women's Safety System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card card-safety border-dark-subtle p-3 p-md-4">
      <div class="card-body">
        <div class="text-center mb-4">
          <div class="stat-icon bg-dark text-white mx-auto mb-2">
            <i class="bi bi-person-badge-fill"></i>
          </div>
          <h3 class="fw-bold">Administrator Login</h3>
          <p class="text-muted small mb-0">Authorized personnel only. Sensitive user PII is restricted.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Admin Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>

          <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
            <i class="bi bi-lock-fill me-1"></i>Sign In to Admin Portal
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
